name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - run: npm install

      - name: Prepare resources (skip heavy bins in CI)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/resources/bin/apache/bin,src-tauri/resources/bin/php,src-tauri/resources/bin/mysql/bin,src-tauri/resources/bin/phpmyadmin | Out-Null
          # dummy placeholders so tauri bundle resources exist; real bins are downloaded locally via download-bin.ps1
          if (!(Test-Path "src-tauri/resources/bin/README.md")) { Set-Content -Path "src-tauri/resources/bin/README.md" -Value "CI placeholder - real bins via download-bin.ps1 locally" }
          dir src-tauri/resources/bin -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
          Write-Host "CI: heavy Apache/MySQL skipped (apachelounge blocks CI download, 0MB zip). Exe builds without bundled bins, app handles missing bin gracefully." -ForegroundColor Yellow

      - name: Build frontend
        run: npm run build

      - name: Tauri build (nsis exe only)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Vanompp ${{ github.ref_name }}"
          releaseBody: "See CHANGELOG.md for details. Installer defaults to C:/Vanompp (browse can change)."
          releaseDraft: false
          prerelease: false
          includeRelease: true
          args: --bundles nsis

