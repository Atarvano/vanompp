[package]
name = "vanompp"
version = "0.1.0"
description = "Vanompp - anti-bingung path localhost untuk SMK kelas 10-11"
authors = ["Vanompp"]
edition = "2021"

[lib]
name = "vanompp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
